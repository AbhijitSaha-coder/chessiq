version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chessiq-postgres-16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chessiq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chessiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chessiq}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chessiq_admin} -d ${POSTGRES_DB:-chessiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    driver: local
